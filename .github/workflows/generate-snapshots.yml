name: Generate UI Snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  snapshots:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift', '**/*.xccconfig', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Select latest available Xcode
        run: |
          echo "Available Xcode versions:"
          ls /Applications/ | grep -E "^Xcode"
          XCODE_PATH=$(ls /Applications/ | grep -E "^Xcode_[0-9]" | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "/Applications/$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Restaurant Tracker/Restaurant Tracker.xcodeproj" \
            -scheme "Restaurant Tracker"

      - name: Pick iOS simulator
        run: |
          # Prefer an iPhone 16 on the newest iOS runtime; fall back to any iPhone, or create one.
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          ios = sorted((k for k in devices if '.iOS-' in k), key=lambda k: [int(p) for p in k.rsplit('iOS-', 1)[1].split('-')], reverse=True)
          phones = [d for k in ios for d in devices[k] if d['name'].startswith('iPhone')]
          preferred = [d for d in phones if d['name'] == 'iPhone 16']
          print((preferred or phones or [{'udid': ''}])[0]['udid'])"
          }
          SIM_ID=$(pick)
          if [ -z "$SIM_ID" ]; then
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)['runtimes'] if r['platform'] == 'iOS']
          print(runtimes[-1]['identifier'] if runtimes else '')")
            echo "No iPhone simulator found, creating one on $RUNTIME"
            SIM_ID=$(xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          fi
          xcrun simctl list devices | grep "$SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Clear old snapshots
        run: rm -rf snapshots && mkdir -p snapshots

      - name: Run snapshot tests
        run: |
          mkdir -p snapshots
          TEST_RUNNER_SNAPSHOTS_EXPORT_DIR="$GITHUB_WORKSPACE/snapshots" \
          TEST_RUNNER_SNAPSHOTS_RUNNING_FOR_PREVIEWS=1 \
          xcodebuild test \
            -project "Restaurant Tracker/Restaurant Tracker.xcodeproj" \
            -scheme "Restaurant Tracker" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing "Restaurant TrackerTests/SnapshotTests" \
            -resultBundlePath "$RUNNER_TEMP/SnapshotTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Print test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/SnapshotTests.xcresult" --format json \
            | python3 -c "import json,sys
          def walk(n, path=''):
              name = n.get('name', '')
              if n.get('nodeType') == 'Failure Message' or (n.get('result') == 'Failed' and not n.get('children')):
                  print(path, '->', name)
              for c in n.get('children', []):
                  walk(c, path + '/' + name)
          for t in json.load(sys.stdin).get('testNodes', []):
              walk(t)"

      - name: Print crash reports
        if: failure()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports/ | grep Restaurant | head -3 | while IFS= read -r name; do
            f="$HOME/Library/Logs/DiagnosticReports/$name"
            echo "=== $f"
            python3 - "$f" <<'PY'
          import json, sys
          lines = open(sys.argv[1]).read().split("\n", 1)
          report = json.loads(lines[1])
          print("exception:", report.get("exception"))
          print("asi:", report.get("asi"))
          images = report.get("usedImages", [])
          for thread in report.get("threads", []):
              if thread.get("triggered"):
                  for frame in thread.get("frames", [])[:25]:
                      image = images[frame.get("imageIndex", 0)].get("name", "?") if images else "?"
                      print(" ", image, frame.get("symbol", "?"), frame.get("sourceFile", ""), frame.get("sourceLine", ""))
          PY
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SnapshotTests.xcresult
          path: ${{ runner.temp }}/SnapshotTests.xcresult

      - name: Remove JSON files from snapshots
        run: find snapshots/ -name "*.json" -delete

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git diff --staged --quiet || git commit -m "chore: update UI snapshots [skip ci]"
          git push
